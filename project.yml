name: semi-vpn
options:
  bundleIdPrefix: com.semivpn
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    # The maintainer's team, which owns the com.semivpn.* bundle IDs. To sign
    # with your own team, build with DEVELOPMENT_TEAM=<team ID> and change
    # bundleIdPrefix and the bundle identifiers below.
    DEVELOPMENT_TEAM: P7V7795SS9
packages:
  OpenVPNCore:
    path: .
targets:
  semi-vpn:
    type: application
    platform: macOS
    sources:
      - App
      - Shared
      - path: ChromeExtension
        type: folder
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: SemiVPN
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: "1.1"
        CFBundleVersion: "3"
        LSMinimumSystemVersion: "14.0"
        NSHighResolutionCapable: true
        LSApplicationCategoryType: public.app-category.utilities
        NSDocumentsFolderUsageDescription: "SemiVPN imports the OpenVPN profile (.ovpn) files you select so it can configure your VPN connection."
        NSDownloadsFolderUsageDescription: "SemiVPN scans your Downloads folder for OpenVPN profile (.ovpn) files so you can import them with one click."
        NSDesktopFolderUsageDescription: "SemiVPN scans your Desktop for OpenVPN profile (.ovpn) files so you can import them with one click."
    dependencies:
      - package: OpenVPNCore
      - target: TunnelProvider
        embed: true
      - target: SemiProxy
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.semivpn.app
        PRODUCT_NAME: SemiVPN
        CODE_SIGN_ENTITLEMENTS: App/semi-vpn.entitlements
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "3"
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks $(inherited)"
        # Homebrew's OpenSSL is single-architecture: build for this Mac's.
        ARCHS: $(NATIVE_ARCH_ACTUAL)
        ONLY_ACTIVE_ARCH: NO
        OTHER_LDFLAGS: "-L$(TARGET_TEMP_DIR)/OpenSSL"
    preBuildScripts:
      - name: Stage OpenSSL
        script: '"$SRCROOT/Scripts/openssl-stage.sh"'
        basedOnDependencyAnalysis: false
    postCompileScripts:
      - name: Bundle OpenSSL
        script: '"$SRCROOT/Scripts/openssl-bundle.sh"'
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: Stamp browser extension
        script: '"$SRCROOT/Scripts/stamp-extension.sh"'
        basedOnDependencyAnalysis: false
  TunnelProvider:
    type: app-extension
    platform: macOS
    sources:
      - TunnelProvider/TunnelProvider.swift
      - Shared
    dependencies:
      - package: OpenVPNCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.semivpn.app.TunnelProvider
        PRODUCT_NAME: TunnelProvider
        CODE_SIGN_ENTITLEMENTS: TunnelProvider/TunnelProvider.entitlements
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: TunnelProvider/Info.plist
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "3"
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks $(inherited)"
        # Homebrew's OpenSSL is single-architecture: build for this Mac's.
        ARCHS: $(NATIVE_ARCH_ACTUAL)
        ONLY_ACTIVE_ARCH: NO
        OTHER_LDFLAGS: "-L$(TARGET_TEMP_DIR)/OpenSSL"
    preBuildScripts:
      - name: Stage OpenSSL
        script: '"$SRCROOT/Scripts/openssl-stage.sh"'
        basedOnDependencyAnalysis: false
    postCompileScripts:
      - name: Bundle OpenSSL
        script: '"$SRCROOT/Scripts/openssl-bundle.sh"'
        basedOnDependencyAnalysis: false
  SemiProxy:
    type: application
    platform: macOS
    sources:
      - ProxyHelper
      - App/LocalProxyServer.swift
      - App/AppLogger.swift
      - Shared
    info:
      path: ProxyHelper/Info.plist
      properties:
        LSUIElement: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.semivpn.proxy
        PRODUCT_NAME: SemiProxy
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "3"
        # Homebrew's OpenSSL is single-architecture: build for this Mac's.
        ARCHS: $(NATIVE_ARCH_ACTUAL)
        ONLY_ACTIVE_ARCH: NO
        SKIP_INSTALL: YES
schemes:
  semi-vpn:
    build:
      targets:
        semi-vpn: all
        TunnelProvider: all
        SemiProxy: all
    run:
      config: Debug
