name: semi-vpn
options:
  bundleIdPrefix: com.semivpn
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    # The maintainer's team, which owns the com.semivpn.* bundle IDs. To sign
    # with your own team, build with DEVELOPMENT_TEAM=<team ID> and change
    # bundleIdPrefix and the bundle identifiers below.
    DEVELOPMENT_TEAM: P7V7795SS9
    # The Network Extension entitlement value of the app and the tunnel
    # system extension: development signing uses the plain value, Developer
    # ID requires the -systemextension one.
    SEMIVPN_NE_PROVIDER: packet-tunnel-provider
  configs:
    Release:
      SEMIVPN_NE_PROVIDER: packet-tunnel-provider-systemextension
      # Release builds are Developer ID builds for notarization (see
      # docs/RELEASING.md): manual signing, secure timestamps. Each target
      # names its provisioning profile below.
      CODE_SIGN_IDENTITY: Developer ID Application
      OTHER_CODE_SIGN_FLAGS: --timestamp
packages:
  OpenVPNCore:
    path: .
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
targets:
  semi-vpn:
    type: application
    platform: macOS
    sources:
      - App
      - Shared
      - path: ChromeExtension
        type: folder
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: SemiVPN
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "14.0"
        NSHighResolutionCapable: true
        LSApplicationCategoryType: public.app-category.utilities
        NSDocumentsFolderUsageDescription: "SemiVPN imports the OpenVPN profile (.ovpn) files you select so it can configure your VPN connection."
        NSDownloadsFolderUsageDescription: "SemiVPN scans your Downloads folder for OpenVPN profile (.ovpn) files so you can import them with one click."
        NSDesktopFolderUsageDescription: "SemiVPN scans your Desktop for OpenVPN profile (.ovpn) files so you can import them with one click."
        # Updates (Sparkle): the feed is attached to the latest published
        # GitHub release; see docs/RELEASING.md.
        SUFeedURL: https://github.com/parasetam0l/semi-vpn/releases/latest/download/appcast.xml
        SUPublicEDKey: SPARKLE_PUBLIC_KEY_PENDING
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        # Always ask before installing.
        SUAllowsAutomaticUpdates: false
    dependencies:
      - package: OpenVPNCore
      - package: Sparkle
      - target: TunnelProvider
        embed: true
        # System extensions must sit in Contents/Library/SystemExtensions.
        copy:
          destination: wrapper
          subpath: Contents/Library/SystemExtensions
      - target: SemiProxy
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.semivpn.app
        PRODUCT_NAME: SemiVPN
        CODE_SIGN_ENTITLEMENTS: App/semi-vpn.entitlements
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "3"
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks $(inherited)"
        # Homebrew's OpenSSL is single-architecture: build for this Mac's.
        ARCHS: $(NATIVE_ARCH_ACTUAL)
        ONLY_ACTIVE_ARCH: NO
        OTHER_LDFLAGS: "-L$(TARGET_TEMP_DIR)/OpenSSL"
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          PROVISIONING_PROFILE_SPECIFIER: "SemiVPN Developer ID"
    preBuildScripts:
      - name: Stage OpenSSL
        script: '"$SRCROOT/Scripts/openssl-stage.sh"'
        basedOnDependencyAnalysis: false
    postCompileScripts:
      - name: Bundle OpenSSL
        script: '"$SRCROOT/Scripts/openssl-bundle.sh"'
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: Stamp browser extension
        script: '"$SRCROOT/Scripts/stamp-extension.sh"'
        basedOnDependencyAnalysis: false
      - name: Sign Sparkle helpers
        script: '"$SRCROOT/Scripts/sparkle-sign.sh"'
        basedOnDependencyAnalysis: false
  TunnelProvider:
    type: system-extension
    platform: macOS
    sources:
      - TunnelProvider/TunnelProvider.swift
      - TunnelProvider/main.swift
      - Shared
    dependencies:
      - package: OpenVPNCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.semivpn.app.TunnelProvider
        # A system extension bundle is named after its identifier.
        PRODUCT_NAME: com.semivpn.app.TunnelProvider
        PRODUCT_MODULE_NAME: TunnelProvider
        CODE_SIGN_ENTITLEMENTS: TunnelProvider/TunnelProvider.entitlements
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: TunnelProvider/Info.plist
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "3"
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks $(inherited)"
        # Homebrew's OpenSSL is single-architecture: build for this Mac's.
        ARCHS: $(NATIVE_ARCH_ACTUAL)
        ONLY_ACTIVE_ARCH: NO
        OTHER_LDFLAGS: "-L$(TARGET_TEMP_DIR)/OpenSSL"
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          PROVISIONING_PROFILE_SPECIFIER: "SemiVPN Tunnel Developer ID"
    preBuildScripts:
      - name: Stage OpenSSL
        script: '"$SRCROOT/Scripts/openssl-stage.sh"'
        basedOnDependencyAnalysis: false
    postCompileScripts:
      - name: Bundle OpenSSL
        script: '"$SRCROOT/Scripts/openssl-bundle.sh"'
        basedOnDependencyAnalysis: false
  SemiProxy:
    type: application
    platform: macOS
    sources:
      - ProxyHelper
      - App/LocalProxyServer.swift
      - App/AppLogger.swift
      - Shared
    info:
      path: ProxyHelper/Info.plist
      properties:
        LSUIElement: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.semivpn.proxy
        PRODUCT_NAME: SemiProxy
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "3"
        # Homebrew's OpenSSL is single-architecture: build for this Mac's.
        ARCHS: $(NATIVE_ARCH_ACTUAL)
        ONLY_ACTIVE_ARCH: NO
        SKIP_INSTALL: YES
      configs:
        Release:
          # No restricted entitlements: Developer ID needs no profile.
          CODE_SIGN_STYLE: Manual
schemes:
  semi-vpn:
    build:
      targets:
        semi-vpn: all
        TunnelProvider: all
        SemiProxy: all
    run:
      config: Debug
